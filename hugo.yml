baseURL: "https://www.sunderner-heimatbund.de"
locale: "de-de"
title: "Sunderner Heimatbund e.V."

# --- enable Tailwind CSS (see hugo-shb-theme's css.html partial) ---
build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: '(postcss|tailwind)\.config\.js'
      target: css

module:
  imports:
    - path: github.com/sunderner-heimatbund/hugo-shb-theme
  mounts:
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: content
      target: content
    - source: data
      target: data
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts
    - source: static
      target: static
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json

params:
  logo: /images/shb-logo.svg
  author:
    name: Sunderner Heimatbund e.V.
    copyright: Copyright © 2024-2026 Sunderner Heimatbund e.V.
