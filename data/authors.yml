- name: Sunderner Heimatbund
  role: Webmaster

- name: Friedrich Schulte-Kramer
  role: 1. Vorsitzender
  bio: "Seit 2007 leite ich die Geschicke des Sunderner Heimatbundes."

- name: Reinhard Kaiser
  role: 2. Vorsitzender
  image: images/authors/reinhard_kaiser.jpg
  bio: "Ich bin Jahrgang 1955 und seit über 15 Jahren im Verein. Als Ortsheimatpfleger in Linnepe dokumentiere ich die Dorfgeschichte in Bild und Schrift – von der Güllener Rin bis zu Feuerwehr- und Schützenwesen."

- name: Axel Grote
  role: Kassierer
  image: images/authors/axel_grote.jpg
  bio: "Ich bin in Sundern aufgewachsen und seit 1986 Bankkaufmann bei der Volksbank Sauerland. Seit 2024 bin ich Kassierer im Heimatbund – ehrenamtlich aktiv bin ich aber schon über 35 Jahre. In der Freizeit fahre ich gern Fahrrad und Motorrad und spiele leidenschaftlich Doppelkopf."

- name: Stefan Schraml
  role: Schriftführer
  image: images/authors/stefan_schraml.jpg
  bio: "Als gebürtiger Hammer lebe ich seit 26 Jahren im schönen Dörnholthausen. Beruflich berate ich als Sicherheitsingenieur in Dortmund, in der Freizeit zieht es mich in die Natur. Seit 16 Jahren im Heimatbund lerne ich als 'Zugezogener' ständig Neues über meine Wahlheimat und kümmere mich seit 2019 als Schriftführer um die Organisation."

